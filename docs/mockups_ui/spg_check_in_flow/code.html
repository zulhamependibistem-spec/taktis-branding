<body class="bg-[#0f172a] h-screen w-full flex justify-center items-center font-body-md text-body-md overflow-hidden antialiased">
<!-- Mobile Device Container (390x844px) -->
<div class="relative w-[390px] h-[844px] bg-[#1e293b] shadow-2xl overflow-hidden flex flex-col mx-auto my-auto">
<!-- Camera Viewfinder Background -->
<div class="absolute inset-0 z-0 bg-[#1e293b]">
<!-- Placeholder for actual camera feed -->
<div class="w-full h-full object-cover opacity-80 mix-blend-screen" data-alt="A simulated camera viewfinder view showing a modern, well-lit retail store interior. The perspective is slightly elevated as if holding a phone for a selfie. Soft, diffused lighting creates a professional, corporate modern aesthetic with slate and subtle glassmorphic accents in the environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAAlCI-DxzjwmEW_ECi72mWkryRJYcEaj-pXa5zOUO3yuyEwdM5DxA-1eHS6vHAY0_MNJhUpPczWfio4ywina7aI4Q6-1g8OdKulSrFXxCWab64G27nxmfnmp8IrSwEO0zUkeQ8SGpVR6JJHW7FRMbZhPfrrQDgRD5TShAaef5iT1RJJBQQFdjEimx8Hk2H3QvGx8Z6m2isyManqOqzNZkjSk7hjD0sm9v5sJ559SanOSGQ9sA-97_A')"></div>
</div>
<!-- Face Guide Overlay -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none pb-32">
<!-- Oval Guide -->
<div class="w-56 h-80 border-4 border-dashed border-white/70 rounded-[100px] mb-4"></div>
<!-- Instruction Text -->
<span class="text-[13px] font-semibold text-white tracking-wide font-headline-sm px-4 py-2 bg-black/40 rounded-full backdrop-blur-sm">
                Posisikan wajah di sini
            </span>
</div>
<!-- Top App Bar -->
<header class="absolute top-0 w-full z-20 flex justify-between items-center px-md h-16 bg-gradient-to-b from-black/60 to-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition-colors cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined text-white" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-white font-bold flex-1 text-center pr-10">Foto Selfie Check-In</h1>
</header>
<!-- Spacer to push bottom sheet down -->
<div class="flex-1 z-10"></div>
<!-- Bottom Sheet -->
<div class="relative z-30 w-full bg-surface-container-lowest rounded-t-[32px] h-[220px] shadow-[0_-8px_30px_rgba(0,0,0,0.12)] flex flex-col px-md py-lg">
<!-- Handle -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto mb-lg"></div>
<!-- GPS Info Row -->
<div class="flex items-center gap-sm mb-lg px-2">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl" data-icon="location_on" data-weight="fill">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Lokasi Terdeteksi</span>
<span class="font-headline-sm text-[16px] text-[#059669] font-bold">KAIRO</span> <!-- emerald-600 closest equivalent -->
</div>
<!-- Verification Badge -->
<div class="ml-auto flex items-center bg-tertiary-container/10 px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-tertiary text-sm mr-1" data-icon="check_circle">check_circle</span>
<span class="text-[10px] text-tertiary font-bold uppercase">Sesuai Outlet</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[52px] bg-primary text-on-primary font-headline-sm text-[16px] font-bold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150 shadow-md">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
                Ambil Foto &amp; Check-In
            </button>
<!-- Optional subtle safe area spacing for very bottom -->
<div class="h-2 w-full mt-auto"></div>
</div>
</div>
