<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SPG Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed": "#131b2e",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "surface": "#f8f9ff",
                        "primary-container": "#4f46e5",
                        "secondary": "#565e74",
                        "primary": "#3525cd",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "surface-container": "#e5eeff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-secondary-fixed-variant": "#3f465c",
                        "inverse-primary": "#c3c0ff",
                        "outline-variant": "#c7c4d8",
                        "surface-variant": "#d3e4fe",
                        "on-surface-variant": "#464555",
                        "surface-container-low": "#eff4ff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#005236",
                        "error-container": "#ffdad6",
                        "on-surface": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed": "#002113",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-container": "#67f4b7",
                        "secondary-fixed": "#dae2fd",
                        "inverse-surface": "#213145",
                        "tertiary": "#005338",
                        "on-secondary-container": "#5c647a",
                        "surface-dim": "#cbdbf5",
                        "tertiary-container": "#006e4b",
                        "outline": "#777587",
                        "surface-tint": "#4d44e3",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-primary-container": "#dad7ff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "margin-desktop": "48px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "data-md": ["JetBrains Mono"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "data-lg": ["JetBrains Mono"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "data-md": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "data-lg": ["18px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="text-on-surface antialiased min-h-screen pb-24 font-body-md flex flex-col max-w-[390px] mx-auto overflow-x-hidden relative shadow-2xl bg-slate-50">
<!-- Profile Header Section -->
<main class="flex-1 w-full px-md pt-xl flex flex-col items-center">
<!-- Avatar -->
<div class="relative w-16 h-16 rounded-full bg-primary-container flex items-center justify-center shadow-sm mb-4">
<span class="font-headline-sm text-headline-sm text-on-primary-container">SJ</span>
<!-- Active indicator -->
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-tertiary-fixed rounded-full border-2 border-surface-container-lowest"></div>
</div>
<!-- Info -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-1 text-center">Sarah Jenkins</h1>
<div class="flex items-center gap-2 mb-1">
<span class="font-data-md text-data-md text-outline">NIP: 20140</span>
</div>
<div class="inline-flex items-center gap-1 bg-primary/10 px-3 py-1 rounded-full mb-8">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">storefront</span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">KAIRO</span>
</div>
<!-- Menu List (Glass Card) -->
<div class="w-full glass-panel rounded-2xl shadow-sm divide-y divide-outline-variant/30 flex flex-col mb-8">
<!-- Item 1: Outlet Saya -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/50 transition-colors active:scale-[0.98] rounded-t-2xl group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="store">store</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Outlet Saya</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Item 2: TL / Supervisor -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/50 transition-colors active:scale-[0.98] group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="supervisor_account">supervisor_account</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-medium">TL / Supervisor</span>
</div>
<span class="font-body-md text-body-md text-outline font-medium">Andi Pratama</span>
</button>
<!-- Item 3: Riwayat Absensi -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/50 transition-colors active:scale-[0.98] group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="history_toggle_off">history_toggle_off</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Riwayat Absensi</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Item 4: Riwayat Laporan -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/50 transition-colors active:scale-[0.98] rounded-b-2xl group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="description">description</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Riwayat Laporan</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
<!-- Logout Button -->
<button class="w-full h-12 bg-error-container text-on-error-container font-body-lg text-body-lg font-semibold rounded-xl border border-error/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="logout">logout</span>
            Keluar
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-sm pb-4 pt-2 bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl border-t border-outline-variant/20 shadow-lg z-50 max-w-[390px] mx-auto left-1/2 -translate-x-1/2">
<!-- Beranda (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:bg-secondary-container/50 active:scale-90 transition-transform px-4 py-1.5 rounded-xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Beranda</span>
</button>
<!-- Aktivitas (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:bg-secondary-container/50 active:scale-90 transition-transform px-4 py-1.5 rounded-xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="assignment">assignment</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Aktivitas</span>
</button>
<!-- Riwayat (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:bg-secondary-container/50 active:scale-90 transition-transform px-4 py-1.5 rounded-xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Riwayat</span>
</button>
<!-- Profil (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1.5 hover:bg-secondary-container/50 active:scale-90 transition-transform w-16">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Profil</span>
</button>
</nav>
</body></html>
